name: Daily Report Generator

on:
  # 暂时禁用定时调度，避免与主工作流冲突（主工作流每30分钟运行一次）
  # schedule:
  #   # 每天北京时间9:00生成日报
  #   # UTC时间1:00生成日报
  #   - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate_report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Generate Daily Report
        env:
          # 日报模式下不进行推送，设置所有推送开关为OFF
          DINGDING_SWITCH: "OFF"
          TELEGRAM_SWITCH: "OFF"
          FEISHU_SWITCH: "OFF"
          DISCARD_SWITCH: "OFF"
        run: python ./DarkWeb-Forums-Tracker.py --daily-report

      - name: Commit changes
        run: |
          git diff
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # 先拉取最新代码，避免推送冲突
          git pull --rebase origin main || echo "拉取代码失败，继续执行"
          # 添加生成的文件，包括index.html（如果存在）
          git add data_leaks.db archive/ rss/ || true
          # 检查index.html是否存在，如果存在则添加
          if [ -f index.html ]; then git add index.html; fi
          git commit -m "生成每日数据泄露监控日报（`date +'%Y-%m-%d'`）" || echo "没有新日报需要提交"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: true
